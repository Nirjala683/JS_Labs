<!DOCTYPE html>
<html>
<head>

    <title>jQuery Events and Effects</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        body {
            font-family: Arial;
            text-align: center;
        }

        #box {
            width: 250px;
            height: 100px;
            background-color: rgb(229, 172, 242);
            margin: 20px auto;
            padding: 20px;
        }

        button {
            margin: 5px;
            padding: 10px;
        }

        #message {
            margin: 20px;
            font-size: 20px;
        }

    </style>

</head>

<body>

<h2>jQuery Events and Effects</h2>

<div id="box">
    Move your mouse here
</div>

<button id="clickBtn">Click</button>

<button id="doubleClickBtn">Double Click</button>

<button id="hideBtn">Hide</button>

<button id="showBtn">Show</button>

<button id="toggleBtn">Toggle</button>

<button id="fadeInBtn">Fade In</button>

<button id="fadeOutBtn">Fade Out</button>

<button id="slideBtn">Slide Toggle</button>

<br><br>

<input type="text" id="name" placeholder="Type something">

<div id="message"></div>

<script>

$(document).ready(function() {

    // click()
    $("#clickBtn").click(function() {
        $("#message").text("Button clicked!");
    });

    // dblclick()
    $("#doubleClickBtn").dblclick(function() {
        $("#message").text("Button double-clicked!");
    });

    // mouseenter()
    $("#box").mouseenter(function() {
        $("#message").text("Mouse entered the box!");
    });

    // keyup()
    $("#name").keyup(function() {
        $("#message").text("You typed: " + $(this).val());
    });

    // hide()
    $("#hideBtn").click(function() {
        $("#box").hide();
    });

    // show()
    $("#showBtn").click(function() {
        $("#box").show();
    });

    // toggle()
    $("#toggleBtn").click(function() {
        $("#box").toggle();
    });

    // fadeIn()
    $("#fadeInBtn").click(function() {
        $("#box").fadeIn();
    });

    // fadeOut()
    $("#fadeOutBtn").click(function() {
        $("#box").fadeOut();
    });

    // slideToggle()
    $("#slideBtn").click(function() {
        $("#box").slideToggle();
    });

});

</script>

</body>
</html>
