<!DOCTYPE html>
<html>

<head>

    <title>Student Management System</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        body {
            font-family: Arial;
            margin: 30px;
        }

        h1 {
            text-align: center;
        }

        form {
            width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid gray;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 10px;
            box-sizing: border-box;
        }

        button {
            padding: 8px 15px;
            margin: 3px;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 30px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: rgb(184, 250, 153);
        }

        #message {
            text-align: center;
            margin: 15px;
            font-weight: bold;
        }

        #search {
            width: 300px;
            display: block;
            margin: 30px auto 10px;
        }

    </style>

</head>

<body>

<h1>Student Management System</h1>
<form id="studentForm">

    <input type="hidden" id="id">

    <label>Name</label>
    <input type="text" id="name" required>

    <label>Roll Number</label>
    <input type="text" id="roll" required>

    <label>Course</label>
    <input type="text" id="course" required>

    <label>Semester</label>
    <input type="number" id="semester" min="1" max="8" required>

    <button type="submit" id="saveBtn">
        Add Student
    </button>

    <button type="button" id="cancelBtn">
        Cancel
    </button>

</form>

<div id="message"></div>

<input type="text" id="search" placeholder="Search student by name...">

<table>

    <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Course</th>
            <th>Semester</th>
            <th>Action</th>
        </tr>

    </thead>

    <tbody id="studentData"></tbody>

</table>

<script>

$(document).ready(function() {

    // Display students when page loads
    loadStudents();


    // ADD / UPDATE STUDENT
    $("#studentForm").submit(function(event) {

        event.preventDefault();

        let id = $("#id").val();

        let data = {
            name: $("#name").val(),
            roll: $("#roll").val(),
            course: $("#course").val(),
            semester: $("#semester").val()
        };

        if (id == "") {

            // ADD
            $.ajax({

                url: "add.php",
                type: "POST",
                data: data,

                success: function(response) {

                    $("#message").text(response);

                    $("#studentForm")[0].reset();

                    loadStudents();
                }

            });

        } else {

            // UPDATE
            data.id = id;

            $.ajax({

                url: "update.php",
                type: "POST",
                data: data,

                success: function(response) {

                    $("#message").text(response);

                    $("#studentForm")[0].reset();

                    $("#id").val("");

                    $("#saveBtn").text("Add Student");

                    loadStudents();
                }

            });

        }

    });


    // SEARCH
    $("#search").keyup(function() {

        let name = $(this).val();

        $.ajax({

            url: "search.php",
            type: "POST",
            data: {
                name: name
            },

            success: function(response) {

                $("#studentData").html(response);

            }

        });

    });


    // CANCEL
    $("#cancelBtn").click(function() {

        $("#studentForm")[0].reset();

        $("#id").val("");

        $("#saveBtn").text("Add Student");

    });

});


// LOAD ALL STUDENTS
function loadStudents() {

    $.ajax({

        url: "fetch.php",
        type: "GET",

        success: function(response) {

            $("#studentData").html(response);

        }

    });

}


// DELETE STUDENT
function deleteStudent(id) {

    if (confirm("Are you sure you want to delete this student?")) {

        $.ajax({

            url: "delete.php",
            type: "POST",

            data: {
                id: id
            },

            success: function(response) {

                $("#message").text(response);

                loadStudents();

            }

        });

    }

}


// EDIT STUDENT
function editStudent(id) {

    $.ajax({

        url: "fetch.php",
        type: "GET",

        success: function(response) {

            // For a simple lab implementation,
            // find the selected row from the table.

            let row = $("#studentData tr").filter(function() {

                return $(this).find("td:first").text() == id;

            });

            $("#id").val(id);

            $("#name").val(row.find("td:eq(1)").text());

            $("#roll").val(row.find("td:eq(2)").text());

            $("#course").val(row.find("td:eq(3)").text());

            $("#semester").val(row.find("td:eq(4)").text());

            $("#saveBtn").text("Update Student");

        }

    });

}

</script>

</body>
</html>
