<!DOCTYPE html>
<html>
<head>
    <title>Student Information</title>

    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 30px auto;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightgreen;
        }

        h2 {
            text-align: center;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<h2>Student Information</h2>

<button onclick="loadStudents()">Load Students</button>

<table id="studentTable">
    <tr>
        <th>Student ID</th>
        <th>Name</th>
        <th>Course</th>
        <th>Semester</th>
        <th>Email</th>
    </tr>
</table>

<script>

function loadStudents() {

    let xhttp = new XMLHttpRequest();

    xhttp.onreadystatechange = function() {

        if (this.readyState == 4 && this.status == 200) {

            let xml = this.responseXML;

            let students = xml.getElementsByTagName("student");

            let table = document.getElementById("studentTable");

            for (let i = 0; i < students.length; i++) {

                let row = table.insertRow();

                row.insertCell(0).innerHTML =
                    students[i].getElementsByTagName("student_id")[0].textContent;

                row.insertCell(1).innerHTML =
                    students[i].getElementsByTagName("name")[0].textContent;

                row.insertCell(2).innerHTML =
                    students[i].getElementsByTagName("course")[0].textContent;

                row.insertCell(3).innerHTML =
                    students[i].getElementsByTagName("semester")[0].textContent;

                row.insertCell(4).innerHTML =
                    students[i].getElementsByTagName("email")[0].textContent;
            }
        }
    };

    xhttp.open("GET", "students.xml", true);
    xhttp.send();
}

</script>

</body>
</html>
